[versions]
agp = "8.9.1"
kotlin = "2.0.21"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
activity = "1.8.0"
constraintlayout = "2.1.4"
navigation = "2.8.9"

fragment-ktx = "1.6.2"
lifecycle-viewmodel-ktx = "2.8.6"
lifecycle-livedata-ktx = "2.8.6"
lifecycle-runtime-ktx = "2.8.6"
timber = "5.0.1"
room = "2.6.1"
recyclerview = "1.3.2"
coroutines = "1.8.1"
ksp = "2.0.21-1.0.28"
